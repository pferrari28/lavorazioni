<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lavorazioni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF1F4; --panel:#FFFFFF; --ink:#17212B; --muted:#566574;
  --line:#D8DEE4; --green:#1C2630; --green-dark:#2F3F50; --amber:#E3B23C;
  --danger:#B3261E; --danger-bg:#FDE7E6; --link:#2F5D8A; --head:#F6F8FA; --ok:#1E7A47; --ok-bg:#E6F4EC;
  --warn-bg:#FFF1C2; --warn:#8A5A00; --side:#1C2630; --radius:8px; --calc:#F3F6F9; --mp:#F7FAFD; --pf:#FBFAF5;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow","Segoe UI",-apple-system,Roboto,Helvetica,Arial,sans-serif;}
[hidden]{display:none !important;}
.app{display:flex;min-height:100vh;}
.side{flex:0 0 210px;background:var(--side);color:#DCE3EA;padding:26px 14px;display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;}
.side h1{font-size:1.6rem;margin:0;color:#fff;font-weight:600;}
.side .sub{margin:4px 0 0;font-size:.8rem;color:#A9B8C6;}
.tabs{display:flex;flex-direction:column;gap:3px;}
.tabs .sep{height:1px;background:#34414F;margin:10px 4px;}
.tab-btn{display:flex;justify-content:space-between;align-items:center;text-align:left;padding:10px 13px;border-radius:6px;border:0;background:none;color:#DCE3EA;font:inherit;font-size:1rem;font-weight:500;cursor:pointer;}
.tab-btn:hover{background:rgba(255,255,255,.08);}
.tab-btn.active{background:var(--amber);color:#1C2630;font-weight:700;}
.tab-btn .cnt{font-size:.75rem;opacity:.75;font-weight:600;}
.tab-btn .dot{width:8px;height:8px;border-radius:50%;background:#FF7A80;display:inline-block;}
.side-foot{margin-top:auto;font-size:.8rem;color:#A9B8C6;display:flex;flex-direction:column;gap:8px;}
.side-foot button{background:none;border:1px solid #4A5A69;color:#DCE3EA;padding:7px 12px;font:inherit;font-size:.8rem;border-radius:6px;cursor:pointer;}
.side-foot button:hover{border-color:var(--amber);color:var(--amber);}
.demo-badge{background:var(--amber);color:#1C2630;border-radius:6px;padding:6px 9px;font-weight:600;line-height:1.3;}

.main-area{flex:1 1 auto;min-width:0;padding:0 24px 60px;}
.daybar{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 0 12px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin-bottom:16px;}
.daybar label{font-weight:600;}
.daybar input[type=date]{font:inherit;font-size:1.1rem;padding:7px 10px;border:2px solid var(--amber);border-radius:6px;background:var(--panel);color:var(--ink);font-weight:600;}
.stato{font-size:.85rem;padding:5px 10px;border-radius:20px;font-weight:600;}
.stato.ok{background:var(--ok-bg);color:var(--ok);}
.stato.mod{background:var(--warn-bg);color:var(--warn);}
.stato.new{background:#E7EEF6;color:var(--link);}
.stato.bz{background:#EDE7F6;color:#5B3E96;}
.daybar .spacer{flex:1;}
.btn{border:0;border-radius:6px;background:var(--green);color:#fff;font:inherit;font-weight:600;font-size:.92rem;padding:9px 16px;cursor:pointer;}
.btn:hover{background:var(--green-dark);}
.btn.amber{background:var(--amber);color:#1C2630;}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
.btn.ghost:hover{border-color:var(--link);color:var(--link);}
.btn.danger{background:var(--danger);}
.btn.sm{padding:6px 11px;font-size:.82rem;}
.btn:disabled{opacity:.55;cursor:wait;}

.view{display:none;}
.view.active{display:block;}
.page-title{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin:0 0 14px;}
.page-title h2{margin:0;font-size:1.45rem;font-weight:700;letter-spacing:.01em;}
.pill{display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-size:.9rem;}
.pill b{font-size:1.05rem;font-variant-numeric:tabular-nums;}
.pill.neg{border-color:var(--danger);background:var(--danger-bg);color:var(--danger);}
.pill.neg input{border-color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger);}
.pill input{font:inherit;font-weight:700;width:90px;padding:4px 7px;border:1px solid var(--line);border-radius:5px;text-transform:uppercase;}
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 10px;}
.toolbar input[type=search],.toolbar input[type=text]{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:6px;min-width:260px;background:var(--panel);}
.toolbar .info{color:var(--muted);font-size:.85rem;}
.toolbar select{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);}

.sheet-wrap{background:var(--panel);border-radius:var(--radius);overflow:auto;max-height:calc(100vh - 210px);border:1px solid var(--line);}
table{border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums;}
.sheet th{background:var(--head);color:var(--muted);font-weight:600;font-size:.74rem;line-height:1.15;padding:6px 5px;border:1px solid var(--line);position:sticky;z-index:3;text-align:center;}
.sheet thead tr.g th{top:0;font-size:.78rem;color:var(--ink);font-weight:700;letter-spacing:.03em;}
.sheet thead tr.h th{top:27px;}
.sheet td{border:1px solid var(--line);padding:0;height:30px;}
.sheet td.n{background:var(--head);color:var(--muted);text-align:center;font-size:.8rem;width:38px;min-width:38px;font-weight:600;}
.sheet td.mp{background:var(--mp);}
.sheet td.pf{background:var(--pf);}
.sheet input{border:0;background:transparent;width:100%;height:30px;padding:0 6px;font:inherit;font-size:.9rem;color:var(--ink);outline:none;}
.sheet input:focus{background:#EAF2FB;box-shadow:inset 0 0 0 2px var(--link);}
.sheet td.r input{text-align:right;}
.sheet td.c input{text-align:center;}
.sheet td.up input{text-transform:uppercase;}
.sheet td.err{background:var(--danger-bg) !important;box-shadow:inset 0 0 0 2px var(--danger);}
.sheet td.rosso{background:#FF9999 !important;}
.sheet td.rosso input{font-weight:700;}
.legend .lr::before{background:#FF9999;}
.sheet td.warn{background:var(--warn-bg) !important;box-shadow:inset 0 0 0 2px #E3B23C;}
.sheet td.calc[data-f=lottoPF]{text-align:center;color:var(--ink);font-weight:500;}
.sheet td.calc{background:var(--calc);text-align:right;padding:0 8px;font-weight:600;color:var(--muted);white-space:nowrap;}
.sheet td.calc.neg{color:var(--danger);background:var(--danger-bg);}
.sheet td.calc.zero{color:var(--ok);}
.sheet td.chk{text-align:center;cursor:pointer;user-select:none;font-weight:700;font-size:1rem;width:44px;}
.sheet td.chk:hover{background:#FFFBEA;}
.sheet tfoot td{background:var(--head);font-weight:700;text-align:right;padding:0 8px;height:32px;border-top:2px solid #AEB8C2;white-space:nowrap;}
.sheet tfoot td.lbl{text-align:left;color:var(--muted);}
.sheet tr.hide{display:none;}
.sheet td.sepcol{width:6px;min-width:6px;padding:0;background:#AEB8C2;border:0;}
.addrow{margin:10px 0 0;display:flex;gap:10px;align-items:center;}
.tip{position:fixed;z-index:200;background:var(--danger);color:#fff;font-size:.8rem;font-weight:600;padding:6px 9px;border-radius:5px;max-width:320px;pointer-events:none;box-shadow:0 4px 14px rgba(0,0,0,.25);}
.tip.w{background:#8A5A00;}
.legend{font-size:.8rem;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap;margin-top:10px;}
.legend span::before{content:"";display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px;}
.legend .le::before{background:var(--danger-bg);box-shadow:inset 0 0 0 2px var(--danger);}
.legend .lw::before{background:var(--warn-bg);box-shadow:inset 0 0 0 2px #E3B23C;}

.panel{background:var(--panel);border-radius:var(--radius);padding:18px 20px;margin-bottom:22px;border:1px solid var(--line);}
.panel h3{margin:0 0 12px;font-size:1.05rem;}
.list th,.list td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap;}
.list th{background:var(--head);color:var(--muted);font-size:.76rem;font-weight:600;position:sticky;top:0;z-index:2;}
.list td.r,.list th.r{text-align:right;}
.list th.thf{cursor:pointer;user-select:none;}
.list th.thf:hover{background:#E9EEF3;color:var(--ink);}
.list th.thf .fil{font-size:.7rem;opacity:.45;margin-left:2px;}
.list th.thf .fil.on{opacity:1;color:var(--link);}
.list th.thf.attivo{background:#E7EEF6;color:var(--link);}
.conf-lotto td,.conf-lotto thead tr:last-child th{white-space:nowrap;width:1%;padding-right:22px;}
.conf-lotto td:nth-child(2),.conf-lotto thead tr:last-child th:nth-child(2){width:auto;}
.conf-lotto tr.vai{cursor:pointer;}
.conf-lotto tr.vai:hover td{background:#FFFBEA;}
.filtro-pop{position:absolute;z-index:150;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 28px rgba(0,0,0,.22);width:270px;padding:10px;font-size:.88rem;}
.filtro-pop .fp-tit{font-weight:700;margin:0 0 6px 2px;}
.filtro-pop .fp-op{display:block;width:100%;text-align:left;border:0;background:none;font:inherit;padding:6px 6px;border-radius:5px;cursor:pointer;color:var(--ink);}
.filtro-pop .fp-op:hover{background:var(--head);}
.filtro-pop .fp-cerca{width:100%;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:5px;margin:6px 0;}
.filtro-pop .fp-lista{max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:5px;padding:4px 0;}
.filtro-pop .fp-v{display:flex;gap:6px;align-items:center;padding:3px 8px;cursor:pointer;}
.filtro-pop .fp-v:hover{background:var(--head);}
.filtro-pop .fp-v i{margin-left:auto;color:var(--muted);font-style:normal;font-size:.78rem;}
.filtro-pop .fp-tutti{font-weight:600;}
.filtro-pop .fp-btn{display:flex;gap:6px;margin-top:8px;align-items:center;}
.list tfoot td{font-weight:700;background:var(--head);border-top:2px solid #AEB8C2;}
.list tr.tot td{font-weight:700;background:var(--head);}
.list .act{display:flex;gap:6px;}
.list-wrap{overflow:auto;max-height:calc(100vh - 250px);}
.empty{color:var(--muted);padding:26px;text-align:center;}
.subtabs{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap;}
.subtabs button{font:inherit;font-weight:600;border:1px solid var(--line);background:var(--panel);padding:7px 14px;border-radius:20px;cursor:pointer;color:var(--ink);}
.subtabs button.on{background:var(--side);color:#fff;border-color:var(--side);}
.mesi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:18px;}

.modal{position:fixed;inset:0;background:rgba(10,16,22,.55);z-index:90;display:none;align-items:flex-start;justify-content:center;padding:6vh 16px;overflow:auto;}
.modal.show{display:flex;}
.modal-card{background:var(--panel);border-radius:var(--radius);padding:22px 24px;width:100%;max-width:640px;box-shadow:0 10px 40px rgba(0,0,0,.35);}
.modal-card h2{margin:0 0 12px;font-size:1.2rem;}
.modal-card p{margin:0 0 12px;line-height:1.45;}
.modal-btns{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;}
.errlist{max-height:50vh;overflow:auto;margin:0;padding:0;list-style:none;border:1px solid var(--line);border-radius:6px;}
.errlist li{padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.92rem;}
.errlist li:hover{background:var(--head);}
.errlist li b{display:inline-block;min-width:150px;}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--side);color:#fff;padding:12px 22px;border-radius:8px;font-weight:600;z-index:130;display:none;}
.toast.show{display:block;}
.toast.err{background:var(--danger);}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--side);}
.login-card{background:var(--panel);border-radius:10px;padding:30px 32px;width:340px;}
.login-card h1{margin:0 0 4px;}
.login-card p{margin:0 0 18px;color:var(--muted);}
.login-card input{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:6px;margin-bottom:12px;}
.login-card .btn{width:100%;padding:11px;}
.login-card .err{color:var(--danger);font-weight:600;font-size:.9rem;min-height:1.2em;}
</style>
</head>
<body>
<script src="vendor/supabase.js"></script>
<script>window.supabase||document.write('<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"><\/script>')</script>

<div id="login" class="login" hidden>
  <form class="login-card" id="login-form">
    <h1>Lavorazioni</h1>
    <p>Accesso · Paolo</p>
    <input type="password" id="login-pw" placeholder="Password" autocomplete="current-password">
    <div class="err" id="login-err"></div>
    <button class="btn" type="submit">Entra</button>
  </form>
</div>

<div class="app" id="app" hidden>
  <aside class="side">
    <div><h1>Lavorazioni</h1><p class="sub">Modulo lavorazioni giornaliere</p></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="side-foot">
      <div id="demo-badge" class="demo-badge" hidden>Modalità prova: i dati restano solo in questo browser.</div>
      <button id="btn-aggiorna" type="button">Aggiorna dati</button>
      <button id="btn-esci" type="button" hidden>Esci</button>
    </div>
  </aside>
  <main class="main-area">
    <div class="daybar" id="daybar">
      <label for="g-data">Data produzione</label>
      <input type="date" id="g-data">
      <span id="g-stato" class="stato new">Nuova</span>
      <span class="spacer"></span>
      <button class="btn ghost" id="btn-bozza" type="button" title="Salva il lavoro a metà, anche con errori: lo ritrovi riaprendo la stessa data">Salva bozza</button>
      <button class="btn amber" id="btn-salva" type="button">Salva giornata</button>
      <button class="btn" id="btn-chiudi" type="button" title="Salva la giornata e ne apre una nuova">Chiudi giornata</button>
      <button class="btn ghost" id="btn-annulla" type="button" title="Esci dalla giornata nuova senza salvare">Annulla</button>
      <button class="btn" id="btn-indietro" type="button" title="Esci dalla giornata riaperta e torna all'archivio">&larr; Torna indietro</button>
    </div>
    <section class="view" id="v-lav"></section>
    <section class="view" id="v-archivio"></section>
    <section class="view" id="v-riepilogo"></section>
    <section class="view" id="v-matricole"></section>
  </main>
</div>

<div class="modal" id="modal"><div class="modal-card" id="modal-card"></div></div>
<div class="toast" id="toast"></div>
<div class="tip" id="tip" hidden></div>

function parseNum(s) {
  s = String(s ?? '').trim().replace(/\s/g, '');
  if (!s) return null;
  if (s.startsWith('=')) {                       // piccole operazioni: =100+50
    const e = s.slice(1).replace(/\.(?=\d{3}(\D|$))/g, '').replace(/,/g, '.');
    if (!/^[\d.+\-*/()]+$/.test(e)) return NaN;
    try { const r = Function('"use strict";return (' + e + ')')(); return isFinite(r) ? Math.round(r * 1000) / 1000 : NaN; } catch (x) { return NaN; }
  }
  if (s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
  else if (/^\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, '');
  const n = Number(s);
  return isNaN(n) ? NaN : n;
}
// 1210 → 12-ott ; 210 → 2-ott ; 12/10, 12-10, 12-ott, 12 ott
function parseGiornoMese(s) {
  s = String(s ?? '').trim().toLowerCase();
  if (!s) return null;
  let d, m;
  let r = s.match(/^(\d{1,2})[\s\-\/.]*([a-z]{3})[a-z]*$/);
  if (r) { d = +r[1]; m = MESI.indexOf(r[2]) + 1; }
  else if ((r = s.match(/^(\d{1,2})[\-\/. ](\d{1,2})$/))) { d = +r[1]; m = +r[2]; }
  else if ((r = s.match(/^(\d{3,4})$/))) { const t = r[1].padStart(4, '0'); d = +t.slice(0, 2); m = +t.slice(2); }
  else return null;
  if (!(m >= 1 && m <= 12 && d >= 1 && d <= 31)) return null;
  if (d > new Date(2024, m, 0).getDate()) return null;
  return d + '-' + MESI[m - 1];
}

// normalizza il valore scritto in una cella; ritorna il valore da salvare
function normalizza(t, raw) {
  const s = String(raw ?? '').trim();
  if (!s) return '';
  switch (t) {
    case 'int': case 'kg': { const n = parseNum(s); return isNaN(n) ? s : n; }
    case 'mese': { const n = parseNum(s); return isNaN(n) ? s : n; }
    case 'anno': { if (/^\d{2}$/.test(s)) return 2000 + +s; if (/^\d{4}$/.test(s)) return +s; return s; }
    case 'lotto': { const u = s.toUpperCase().replace(/\s+/g, ''); const p = PAROLE_LOTTO.find(w => w.startsWith(u) && u.length >= 3); return p || u; }
    case 'matr': return s.toUpperCase().replace(/\s+/g, ' ');
    case 'data': return parseGiornoMese(s) || s;
    case 'orig': { const g = parseGiornoMese(s); if (g) return g; return s.toUpperCase().replace(/\s+/g, ''); }
    case 'rif': return s.replace(/\s+/g, '').replace(/[–—]/g, '-');
    default: return s;
  }
}
function mostra(t, v) {
  if (vuoto(v)) return '';
  if (t === 'kg') return typeof v === 'number' ? fmtKg(v) : v;
  return String(v);
}

function rigaUsata(r) { return Object.keys(r).some(k => !vuoto(r[k])); }

function completaRighe(dati) {
  KEYS.forEach(k => {
    if (!dati[k]) dati[k] = { linea: '', righe: [] };
    const r = dati[k].righe || (dati[k].righe = []);
    while (r.length < LAV[k].righe) r.push({});
  });
  return dati;
}
function datiDaSalvare(dati) {
  const out = {};
  KEYS.forEach(k => {
    const r = dati[k].righe.map(x => { const o = {}; Object.keys(x).forEach(f => { if (!vuoto(x[f])) o[f] = x[f]; }); return o; });
    while (r.length && !rigaUsata(r[r.length - 1])) r.pop();
    out[k] = { linea: dati[k].linea || '', righe: r };
  });
  return out;
}

function annoDi(iso) { return +iso.slice(0, 4); }

  const [d, ms] = gm.split('-'); const m = MESI.indexOf(ms) + 1;

}
function dataTestata(key, cur) { return isoToIt(cur.data); }

  const out = [];
  for (const p of String(s).split(',')) {
    const m = p.match(/^(\d+)(?:-(\d+))?$/); if (!m) return null;
    const a = +m[1], b = m[2] ? +m[2] : a; if (b < a || b - a > 500) return null;
    for (let i = a; i <= b; i++) out.push(i);

}
function controllaRiga(key, righe, i) {

  const n = v => typeof v === 'number';
  // formati
  ['forme', 'peso', 'pesoOrig', 'stag', 'pezzi', 'pesoPF', 'sfridi', 'cat3'].forEach(k => {

  if (!vuoto(r.anno) && !(n(r.anno) && r.anno >= 2000 && r.anno <= 2099)) E.anno = 'Anno: scrivi 2 cifre (24 → 2024)';
  const parole = L.tipo === 'A' ? PAROLE_LOTTO : ['RESIDUO', 'INTERNO'];
  if (!vuoto(r.lotto) && !(RE_LOTTO_P.test(r.lotto) || parole.includes(r.lotto)))
    E.lotto = 'Lotto: formato 26P123 o P1792 oppure ' + parole.join(', ');
  if (!vuoto(r.matr) && !MATRICOLE.has(normMatr(r.matr))) R.matr = 'Matricola non presente nella pagina Matricole';

  const mp = MP_KEYS.some(k => k !== 'piatti' && !vuoto(r[k]));

    if (vuoto(r.lotto)) E.lotto = E.lotto || 'Lotto obbligatorio';
  }
  if (!vuoto(r.lotto) && !SENZA_MATRICOLA.includes(r.lotto)) {     // con il lotto servono matricola, mese e anno
    if (vuoto(r.matr)) E.matr = 'Matricola obbligatoria';

  if (!vuoto(r.peso) && vuoto(r.forme)) E.forme = E.forme || 'Numero forme obbligatorio se c\'è il peso';

    if (!vuoto(r.orig) && !(/^\d{1,2}-[a-z]{3}$/.test(r.orig) || RE_LOTTO_EST.test(r.orig) || RE_LOTTO_P.test(r.orig)))

    if (!vuoto(r.forme) && vuoto(r.peso)) {              // forme non tagliate in giornata
      if (vuoto(r.orig)) E.orig = 'Forme senza peso: compila origine sfrido';
      if (vuoto(r.pesoOrig)) E.pesoOrig = 'Forme senza peso: compila il peso dello sfrido/semilavorato';
    }
    if (!vuoto(r.orig) && vuoto(r.pesoOrig)) E.pesoOrig = E.pesoOrig || 'Peso obbligatorio';
    if (!vuoto(r.pesoOrig) && vuoto(r.orig)) E.orig = E.orig || 'Origine sfrido obbligatoria';
    // prodotto finito

    if (!vuoto(r.rif)) {

      else {
        const manc = lst.filter(x => !righe[x - 1] || !MP_KEYS.some(k => k !== 'piatti' && !vuoto(righe[x - 1][k])));

    }
    const pf = ['pesoPF', 'sfridi', 'cat3'].some(k => !vuoto(r[k]));
    if (pf && vuoto(r.peso)) E.peso = E.peso || 'Manca il peso delle forme in ingresso';
    const med = media(r);
    if (med != null && (med < MEDIA_MIN || med > MEDIA_MAX)) W.media = 'Media forme fuori da ' + MEDIA_MIN + '–' + MEDIA_MAX + ' kg';
    const rim = rimanente(key, r);

function media(r) { return (typeof r.peso === 'number' && typeof r.forme === 'number' && r.forme > 0) ? r.peso / r.forme : null; }

      prodotto: sommaCol(rr, 'pesoPF'), sfridi: sommaCol(rr, 'sfridi'), cat3: L.tipo === 'A' || L.cat3 ? sommaCol(rr, 'cat3') : 0,

const comboLotto = r => normMatr(r.matr) + '|' + (r.mese ?? '') + '|' + (r.anno ?? '');
const meseAnno = r => r.mese && r.anno ? MESI[r.mese - 1] + '-' + String(r.anno).slice(-2) : '—';
async function controllaLotti() {
  const qui = {};                                     // lotto → [{k, i, r}]
  KEYS.forEach(k => CUR.dati[k].righe.forEach((r, i) => { if (RE_LOTTO_P.test(r.lotto || '')) (qui[r.lotto] = qui[r.lotto] || []).push({ k, i, r }); }));
  const lotti = Object.keys(qui); if (!lotti.length) return [];
  const reg = await DB.lottiRegistrati(lotti, CUR.data);
  const out = [];
  lotti.forEach(l => {
    const righe = [], visti = new Set();
    qui[l].forEach(x => { const c = comboLotto(x.r); if (visti.has('q' + c)) return; visti.add('q' + c);
      righe.push({ quando: 'Questa giornata', dove: `${LAV[x.k].nome} riga ${x.i + 1}`, matr: x.r.matr || '—', ma: meseAnno(x.r), c, k: x.k, i: x.i }); });
    reg.filter(x => x.lotto === l).forEach(x => { const c = comboLotto(x);
      righe.push({ quando: 'Già registrato il ' + isoToIt(x.data), dove: `${LAV[x.lav] ? LAV[x.lav].nome : x.lav} riga ${x.riga}`, matr: x.matr || '—', ma: meseAnno(x), c }); });
    const combos = new Set(righe.map(x => x.c));
    if (combos.size > 1) {
      const primo = righe.find(x => x.k) || {};

    }
  });

}

function onTasto(e) {

  if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
    const len = inp.value.length, a = inp.selectionStart, b = inp.selectionEnd;
    const tutto = a === 0 && b === len;
    if (e.key === 'ArrowLeft' && !(tutto || (a === 0 && b === 0))) return;
    if (e.key === 'ArrowRight' && !(tutto || (a === len && b === len))) return;
    const celle = [...inp.closest('tr').querySelectorAll('td[data-f]')].filter(td => td.querySelector('input'));
    const j = celle.indexOf(inp.closest('td')) + (e.key === 'ArrowLeft' ? -1 : 1);

  let dr = 0;
  if (e.key === 'Enter' || e.key === 'ArrowDown') dr = 1; else if (e.key === 'ArrowUp') dr = -1; else return;

async function importaBackup(file) {

    <label style="display:block;padding:10px 12px;border:1px solid var(--line);border-radius:6px;cursor:pointer"><input type="radio" name="imp" value="tutto"> <b>Sostituisci tutto</b> — il sito diventa identico al backup (prima scarico in automatico un backup di sicurezza di quello che c'è ora)</label>

const COL_RIEP_A = [['data', 'Giornata'], ['n', 'N°'], ['piatti', 'Piatti'], ['lotto', 'Lotto'], ['matr', 'Matricola'], ['mese', 'Mese'], ['anno', 'Anno'], ['forme', 'Forme'], ['peso', 'Peso kg'], ['orig', 'Origine sfrido'], ['pesoOrig', 'Peso kg'], ['rif', 'Rif. MP'], ['marchio', 'Marchio / codice / formato'], ['stag', 'Stag.'], ['pezzi', 'Pz/cart.'], ['lottoPF', 'Lotto PF'], ['pesoPF', 'Prodotto finito kg'], ['sfridi', 'Sfridi kg'], ['cat3', 'Cat. 3 kg'], ['note', 'Note'], ['linea', 'Linea']];
const COL_RIEP_B = [['data', 'Giornata'], ['n', 'N°'], ['lotto', 'Lotto'], ['matr', 'Matricola'], ['mese', 'Mese'], ['anno', 'Anno'], ['forme', 'Forme'], ['peso', 'Peso kg'], ['media', 'Media kg/forma'], ['lottoPF', 'Lotto PF'], ['pesoPF', 'Prodotto finito kg'], ['sfridi', 'Sfridi kg'], ['cat3', 'Cat. 3 kg'], ['rim', 'Rimanente kg']];
const KG_COLS = new Set(['peso', 'pesoOrig', 'pesoPF', 'sfridi', 'cat3', 'rim', 'media']);
function colRiep(k) { const c = LAV[k].tipo === 'A' ? COL_RIEP_A : COL_RIEP_B; return c.filter(([f]) => !(f === 'piatti' && !LAV[k].piatti) && !(f === 'cat3' && LAV[k].tipo === 'B' && !LAV[k].cat3)); }
function righeRiepilogo(k, giornate) {
  const out = [];
  giornate.slice().sort((a, b) => a.data.localeCompare(b.data)).forEach(g => {
    const D = g.dati[k]; if (!D) return;
    (D.righe || []).forEach((r, i) => {
      if (!rigaUsata(r)) return;
      const o = Object.assign({}, r, { data: g.data, n: i + 1, linea: D.linea || '', lottoPF: haPFdati(r) ? lottoGiornata(g.data) : '' });
      if (LAV[k].tipo === 'B') { const m = media(r); o.media = m == null ? '' : Math.round(m * 10) / 10; o.rim = rimanente(k, r); }

function filtraRiep(rows) {
  const q = RIEP.q.trim().toLowerCase(); if (!q) return rows;

}
const VUOTE = '(vuote)';
const valFiltro = (f, v) => { const t = cellaRiep(f, v); return t === '' ? VUOTE : t; };
function righeBaseRiep() {
  const g = Object.keys(CACHE_DATI).filter(d => ARCH.some(x => x.data === d) && (!RIEP.mese || meseKey(d) === RIEP.mese)).map(d => ({ data: d, dati: CACHE_DATI[d] }));

function applicaFiltri(rows, tranne) {

  const righe = lst.map((m, i) => `<row r="${i + 2}"${att}>${cellaXml('A' + (i + 2), '124', /^\d+$/.test(m) ? { n: +m } : { s: m })}</row>`).join('');
  return xml.replace(/<sheetData>[\s\S]*<\/sheetData>/, '<sheetData>' + head + righe + '</sheetData>')
    .replace(/<dimension ref="A1:A\d+"\/>/, `<dimension ref="A1:A${ultimo}"/>`)
    .replace(/<autoFilter[\s\S]*?<\/autoFilter>/, `<autoFilter ref="A1:A${ultimo}"/>`);
}

// riepilogo: file Excel semplice (più fogli)
function xlsxSemplice(fogli) {
  const colL = n => { let s = ''; n++; while (n) { const m = (n - 1) % 26; s = String.fromCharCode(65 + m) + s; n = Math.floor((n - 1) / 26); } return s; };
  const sheets = fogli.map(f => {
    const rows = f.righe.map((r, ri) => `<row r="${ri + 1}">${r.map((v, ci) => {
      const ref = colL(ci) + (ri + 1); const b = (f.grassetto || []).includes(ri);
      if (v == null || v === '') return '';
      if (typeof v === 'number') return `<c r="${ref}" s="${b ? 3 : 2}"><v>${v}</v></c>`;
      return `<c r="${ref}" s="${b ? 1 : 0}" t="inlineStr"><is><t xml:space="preserve">${xmlEsc(v)}</t></is></c>`;
    }).join('')}</row>`).join('');
    const cols = (f.larghezze || []).map((w, i) => `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('');
    return `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews>${cols ? '<cols>' + cols + '</cols>' : ''}<sheetData>${rows}</sheetData></worksheet>`;
  });
  const files = [
    ['[Content_Types].xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>${sheets.map((_, i) => `<Override PartName="/xl/worksheets/sheet${i + 1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')}</Types>`],
    ['_rels/.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
    ['xl/workbook.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets>${fogli.map((f, i) => `<sheet name="${xmlEsc(f.nome.slice(0, 31))}" sheetId="${i + 1}" r:id="rId${i + 1}"/>`).join('')}</sheets></workbook>`],
    ['xl/_rels/workbook.xml.rels', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">${fogli.map((_, i) => `<Relationship Id="rId${i + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet${i + 1}.xml"/>`).join('')}<Relationship Id="rId${fogli.length + 1}" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>`],
    ['xl/styles.xml', `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="1"><numFmt numFmtId="164" formatCode="#,##0.00"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="2"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="4"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="164" fontId="1" fillId="0" borderId="0" xfId="0" applyNumberFormat="1" applyFont="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>`],
    ...sheets.map((s, i) => [`xl/worksheets/sheet${i + 1}.xml`, s]),
  ];
  return creaZip(files);
}
// riepilogo: parte dal file RIEPILOGO originale (stessa formattazione)
const FOGLI_R = { grattugiato: 'xl/worksheets/sheet2.xml', scaglie: 'xl/worksheets/sheet3.xml', cubetti: 'xl/worksheets/sheet4.xml', scrostatura: 'xl/worksheets/sheet5.xml', spiattatura: 'xl/worksheets/sheet6.xml' };
async function esportaRiepilogoModello() {
  const mk = RIEP.mese;
  let giornate;
  try { giornate = (await datiPeriodo(mk)).sort((a, b) => a.data.localeCompare(b.data)); } catch (e) { toast('Errore: ' + e.message, true); return; }
  if (!giornate.length) { toast('Nessuna giornata da esportare', true); return; }
  const files = Object.assign({}, MODELLO_R);
  const tot = {}; KEYS.forEach(k => { tot[k] = { introdotta: 0, prodotto: 0, sfridi: 0, cat3: 0, fasce: {} }; FASCE.forEach(([f]) => tot[k].fasce[f] = 0); });
  let wb = files['xl/workbook.xml'];
  KEYS.forEach(k => {
    const vals = [];
    giornate.forEach(g => {
      const D = completaRighe(JSON.parse(JSON.stringify(g.dati)))[k];
      const t = calcolaTotali({ ...completaRighe(JSON.parse(JSON.stringify(g.dati))) })[k];
      ['introdotta', 'prodotto', 'sfridi', 'cat3'].forEach(f => tot[k][f] += t[f] || 0);
      if (t.fasce) FASCE.forEach(([f]) => tot[k].fasce[f] += t.fasce[f]);
      D.righe.forEach((r, i) => {
        if (!rigaUsata(r)) return;
        const v = valoriExcel(k, r, g.data); v.A = { n: i + 1 };
        if (!vuoto(r.anno)) v.E = typeof r.anno === 'number' ? { s: String(r.anno) } : { s: String(r.anno) };
        vals.push(v);
      });
    });
    const res = compilaFoglioRiep(files[FOGLI_R[k]], vals);
    files[FOGLI_R[k]] = res.xml;
    wb = wb.replace(new RegExp('(' + LAV[k].xls + '!\\$A\\$1:\\$[A-Z]+\\$)(\\d+)'), (m, a, n) => a + Math.max(+n, res.ultimo));
  });
  files['xl/worksheets/sheet1.xml'] = compilaFoglioRiepilogo(files['xl/worksheets/sheet1.xml'], tot, mk ? MESI[+mk.slice(5, 7) - 1] + '-' + mk.slice(2, 4) : 'tutti');
  files['xl/workbook.xml'] = wb.replace(/<calcPr([^>]*?)\/>/, (m, a) => '<calcPr' + a.replace(/\s*fullCalcOnLoad="[^"]*"/, '') + ' fullCalcOnLoad="1"/>');
  const ord = ['[Content_Types].xml', '_rels/.rels'];
  const lista = ord.map(n => [n, files[n]]).concat(Object.keys(files).filter(n => !ord.includes(n)).map(n => [n, files[n]]));
  scarica(creaZip(lista), 'RIEPILOGO ' + (mk ? meseLabel(mk) : 'tutti i mesi') + '.xlsx');
  toast('File RIEPILOGO creato');
}
function compilaFoglioRiep(xml, vals) {
  const rows = leggiRighe(xml), primo = 11, n = Math.max(vals.length, 20), ultimo = primo + n - 1, out = [];
  const somma = col => Math.round(vals.reduce((s2, v) => s2 + (v[col] && typeof v[col].n === 'number' ? v[col].n : 0), 0) * 1000) / 1000;
  for (let r = 1; r < primo; r++) {
    const R = rows[r]; if (!R) continue;
    if (r !== 6) { out.push(R.raw.replace(/<v[^>]*>[^<]*<\/v>/g, m => m)); continue; }
    const celle = R.celle.map(c => {
      if (c.inner && c.inner.includes('<f>')) {
        const f = c.inner.match(/<f>([^<]*)<\/f>/)[1].replace(/([A-Z])11:([A-Z])\d+/, (m, a, b) => a + '11:' + b + Math.max(1000, ultimo));
        return `<c r="${c.col}6"${c.s ? ` s="${c.s}"` : ''}><f>${f}</f><v>${somma(c.col)}</v></c>`;
      }
      return `<c r="${c.col}6"${c.attrs}${c.inner != null ? '>' + c.inner + '</c>' : '/>'}`;
    });
    out.push(`<row r="6"${R.attrs}>${celle.join('')}</row>`);
  }
  for (let i = 0; i < n; i++) {
    const r = primo + i, R = i === 0 ? rows[11] : rows[12], v = vals[i] || {};
    out.push(`<row r="${r}"${R.attrs}>${R.celle.map(c => cellaXml(c.col + r, c.s, v[c.col])).join('')}</row>`);
  }
  xml = xml.replace(/<sheetData>[\s\S]*<\/sheetData>/, '<sheetData>' + out.join('') + '</sheetData>')
    .replace(/<dimension ref="A1:([A-Z]+)\d+"\/>/, (m, a) => `<dimension ref="A1:${a}${ultimo}"/>`);
  return { xml, ultimo };
}
function compilaFoglioRiepilogo(xml, tot, etichetta) {
  const rows = leggiRighe(xml), out = [];
  const val = {};                                   // riga 2-6 nell'ordine del modello
  ORDINE_RIEP.forEach((k, j) => { const t = tot[k], r = j + 2; val[r] = { C: t.introdotta, D: 0, E: t.prodotto, F: t.sfridi, G: t.cat3 }; val[r].H = val[r].C - val[r].D - val[r].E - val[r].F - val[r].G; });
  const s7 = c => [2, 3, 4, 5, 6].reduce((a, r) => a + val[r][c], 0);
  const p1 = {}, g1 = {}; FASCE.forEach(([f]) => { p1[f] = tot.scaglie.fasce[f] + tot.cubetti.fasce[f]; g1[f] = tot.grattugiato.fasce[f]; });
  const arr = x => Math.round(x * 1000) / 1000;
  Object.keys(rows).map(Number).sort((a, b) => a - b).forEach(r => {
    const R = rows[r];
    const celle = R.celle.map(c => {
      const ref = c.col + r, st = c.s ? ` s="${c.s}"` : '';
      if (r === 2 && c.col === 'A') return cellaXml(ref, c.s, { s: etichetta });
      if (c.inner && c.inner.includes('<f>')) {
        const f = c.inner.match(/<f>([^<]*)<\/f>/)[0];
        const v = r >= 2 && r <= 6 ? val[r][c.col] : r === 7 ? s7(c.col) : 0;
        return `<c r="${ref}"${st}>${f}<v>${arr(v)}</v></c>`;
      }
      if (c.col === 'C' && r >= 12 && r <= 17) return cellaXml(ref, c.s, { n: arr(p1[FASCE[r - 12][0]]) });
      if (c.col === 'C' && r === 18) return cellaXml(ref, c.s, { n: arr(FASCE.reduce((a, [f]) => a + p1[f], 0)) });
      if (c.col === 'C' && r >= 21 && r <= 26) return cellaXml(ref, c.s, { n: arr(g1[FASCE[r - 21][0]]) });
      if (c.col === 'C' && r === 27) return cellaXml(ref, c.s, { n: arr(FASCE.reduce((a, [f]) => a + g1[f], 0)) });
      return `<c r="${ref}"${c.attrs}${c.inner != null ? '>' + c.inner + '</c>' : '/>'}`;
    });
    out.push(`<row r="${r}"${R.attrs}>${celle.join('')}</row>`);
  });
  return xml.replace(/<sheetData>[\s\S]*<\/sheetData>/, '<sheetData>' + out.join('') + '</sheetData>');
}
function esportaRiepilogoRighe() {
  const g = Object.keys(CACHE_DATI).filter(d => ARCH.some(x => x.data === d) && (!RIEP.mese || meseKey(d) === RIEP.mese)).map(d => ({ data: d, dati: CACHE_DATI[d] }));
  const fogli = KEYS.map(k => {
    const cols = colRiep(k), rows = filtraRiep(righeRiepilogo(k, g));
    const righe = [cols.map(c => c[1])].concat(rows.map(r => cols.map(([f]) => {
      const v = r[f]; if (f === 'data') return isoToIt(v); if (f === 'piatti') return v ? 'X' : '';
      return typeof v === 'number' ? (f === 'mese' || f === 'anno' || f === 'n' || f === 'forme' || f === 'stag' || f === 'pezzi' ? v : Math.round(v * 100) / 100) : (v ?? '');
    })));
    return { nome: LAV[k].xls, righe, grassetto: [0], larghezze: cols.map(([f]) => f === 'marchio' ? 32 : f === 'data' ? 12 : 11) };
  });
  scarica(xlsxSemplice(fogli), 'RIEPILOGO righe ' + (RIEP.mese ? meseLabel(RIEP.mese) : 'tutti i mesi') + '.xlsx');
}
function esportaRiepilogoMensile() {
  const mesi = RIEP.mese ? [RIEP.mese] : [...new Set(ARCH.map(x => meseKey(x.data)))].sort();
  const righe = [['Mese', 'Lavorazione', 'Quantità introdotta kg', 'Prodotto ottenuto kg', 'Residuo kg', 'Cat. 3 kg', 'Buon peso + calo peso kg']], grassetto = [0];
  mesi.forEach(m => { const { rows, T } = righeMensili(m); rows.concat([T]).forEach(r => { righe.push([meseLabel(m), r.lav, ...['introdotta', 'prodotto', 'residuo', 'cat3', 'buon'].map(f => Math.round(r[f] * 100) / 100)]); }); grassetto.push(righe.length - 1); righe.push([]); });
  const pf = [['Mese', 'Prospetto', 'Fascia stagionatura', 'Kg']], gP = [0];
  mesi.forEach(m => [['P1', 'PORZIONATO SENZA CROSTA', ['scaglie', 'cubetti']], ['G1', 'GRATTUGIATO', ['grattugiato']]].forEach(([c, t, ks]) => {
    const o = fasceMese(m, ks); FASCE.forEach(([f, l]) => pf.push([meseLabel(m), c + ' ' + t, l, Math.round(o[f] * 100) / 100]));
    pf.push([meseLabel(m), c + ' ' + t, 'TOTALE', Math.round(FASCE.reduce((s, [f]) => s + o[f], 0) * 100) / 100]); gP.push(pf.length - 1);
  }));
  scarica(xlsxSemplice([{ nome: 'RIEPILOGO', righe, grassetto, larghezze: [16, 14, 22, 22, 14, 12, 24] }, { nome: 'P1 G1', righe: pf, grassetto: gP, larghezze: [16, 30, 30, 14] }]),
    'RIEPILOGO mensile ' + (RIEP.mese ? meseLabel(RIEP.mese) : 'tutti i mesi') + '.xlsx');
}

// ---------- modali e avvisi ----------
function apriModal(html) { $('modal-card').innerHTML = html; $('modal').classList.add('show'); $('modal-card').querySelectorAll('[data-close]').forEach(b => b.onclick = chiudiModal); }
function chiudiModal() { $('modal').classList.remove('show'); }
function chiedi(tit, testo, si, no, pericolo) {
  return new Promise(res => {
    apriModal(`<h2>${tit}</h2><p>${testo}</p><div class="modal-btns"><button class="btn ghost" id="m-no">${no}</button><button class="btn ${pericolo ? 'danger' : ''}" id="m-si">${si}</button></div>`);
    $('m-si').onclick = () => { chiudiModal(); res(true); }; $('m-no').onclick = () => { chiudiModal(); res(false); };
  });
}
let toastT; function toast(m, err) { const t = $('toast'); t.textContent = m; t.className = 'toast show' + (err ? ' err' : ''); clearTimeout(toastT); toastT = setTimeout(() => t.className = 'toast', 3500); }
window.addEventListener('beforeunload', e => { if (CUR && CUR.dirty) { e.preventDefault(); e.returnValue = ''; } });

$('btn-aggiorna').addEventListener('click', async () => {
  ARCH = null; BOZZE = null; Object.keys(CACHE_DATI).forEach(k => delete CACHE_DATI[k]);
  if (LAV[PAGE]) { if (!CUR.dirty) await apriGiornata(CUR.data, { forza: true }); else toast('Dati aggiornati (la giornata aperta ha modifiche non salvate, non l\'ho ricaricata)'); }
  else vai(PAGE);
});

// ---------- avvio ----------
async function avvia() {
  $('login').hidden = true; $('app').hidden = false;
  try { MATRICOLE = new Set((await DB.matricole()).map(normMatr)); } catch (e) { toast('Elenco matricole non caricato: ' + e.message, true); }
  $('demo-badge').hidden = !DEMO; $('btn-esci').hidden = DEMO;
  const bz = leggiBozza();
  if (bz && bz.data && bz.dati) {
    CUR = { data: bz.data, dati: completaRighe(bz.dati), salvata: !!bz.salvata, dirty: true };
    aggiornaStato(); vai('grattugiato');
    toast('Ho recuperato le modifiche non salvate della giornata del ' + isoToIt(bz.data));
  } else { CUR = giornataVuota(''); aggiornaStato(); vai('grattugiato'); }
}
if (DEMO) avvia();
else {
  $('login-form').addEventListener('submit', async e => {
    e.preventDefault(); $('login-err').textContent = '';
    const { error } = await sb.auth.signInWithPassword({ email: EMAIL_PAOLO, password: $('login-pw').value });
    if (error) { $('login-err').textContent = 'Password errata'; return; }
    avvia();
  });
  $('btn-esci').addEventListener('click', async () => {
    if (CUR && CUR.dirty && !(await chiedi('Uscire?', 'Ci sono modifiche non salvate (restano salvate solo in questo PC come bozza).', 'Esci', 'Annulla'))) return;
    await sb.auth.signOut(); location.reload();
  });
  sb.auth.getSession().then(({ data }) => { if (data.session) avvia(); else $('login').hidden = false; });
}
